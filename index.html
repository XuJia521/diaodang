<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>腾讯微信调档协作流程</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #0d47a1;
            --primary-light: #e3f2fd;
            --accent: #00c853;
            --text-dark: #1a1a2e;
            --text-muted: #5a5a7a;
            --bg-gradient-start: #f0f4ff;
            --bg-gradient-end: #ffffff;
            --card-shadow: 0 10px 40px rgba(26, 115, 232, 0.08);
            --step-shadow: 0 4px 20px rgba(26, 115, 232, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-dark);
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary) 0%, #4fc3f7 50%, var(--accent) 100%);
        }

        .header {
            padding: 48px 40px 32px;
            text-align: center;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 2px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #07c160 0%, #00b259 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(7, 193, 96, 0.3);
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 2px;
        }

        .steps-container {
            padding: 40px;
        }

        .step {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            padding: 24px;
            background: linear-gradient(135deg, #fafbff 0%, #ffffff 100%);
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(26, 115, 232, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .step::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--accent) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .step:hover {
            transform: translateY(-2px);
            box-shadow: var(--step-shadow);
            border-color: rgba(26, 115, 232, 0.15);
        }

        .step:hover::before {
            opacity: 1;
        }

        .step:last-child {
            margin-bottom: 0;
        }

        .step-number {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }

        .step-content {
            flex: 1;
            padding-top: 6px;
        }

        .step-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-dark);
            line-height: 1.6;
        }

        .step-details {
            margin-top: 12px;
            padding-left: 16px;
            border-left: 2px solid var(--primary-light);
        }

        .step-detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .step-detail-item::before {
            content: '';
            width: 6px;
            height: 6px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .price-section {
            padding: 0 40px 40px;
        }

        .price-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 16px;
            padding: 28px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(26, 115, 232, 0.35);
            position: relative;
            overflow: hidden;
        }

        .price-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
        }

        .price-label {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
        }

        .price-value {
            font-size: 32px;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
        }

        .price-unit {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
        }

        .footer {
            padding: 24px 40px;
            text-align: center;
            background: var(--primary-light);
            border-top: 1px solid rgba(26, 115, 232, 0.1);
        }

        .footer-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 16px;
            }

            .header {
                padding: 36px 24px 28px;
            }

            .title {
                font-size: 22px;
            }

            .steps-container {
                padding: 24px;
            }

            .step {
                padding: 18px;
                gap: 14px;
            }

            .step-number {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .step-title {
                font-size: 15px;
            }

            .price-section {
                padding: 0 24px 24px;
            }

            .price-card {
                padding: 22px 24px;
                flex-direction: column;
                gap: 8px;
            }

            .price-value {
                font-size: 28px;
            }
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .step {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .step:nth-child(1) { animation-delay: 0.1s; }
        .step:nth-child(2) { animation-delay: 0.2s; }
        .step:nth-child(3) { animation-delay: 0.3s; }
        .step:nth-child(4) { animation-delay: 0.4s; }
        .step:nth-child(5) { animation-delay: 0.5s; }
        .step:nth-child(6) { animation-delay: 0.6s; }

        .price-card {
            animation: fadeInUp 0.5s ease forwards;
            animation-delay: 0.7s;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088-.181-.013-.363-.025-.547-.034h-.059zm-2.853 3.04c.504 0 .913.416.913.93 0 .513-.41.93-.913.93a.92.92 0 0 1-.914-.93c0-.514.41-.93.914-.93zm4.828 0c.504 0 .913.416.913.93 0 .513-.41.93-.913.93a.92.92 0 0 1-.914-.93c0-.514.41-.93.914-.93z"/>
                    </svg>
                </div>
                <h1 class="title">腾讯微信调档协作流程</h1>
            </div>

            <div class="steps-container">
                <div class="step">
                    <div class="step-number">1</div>
                    <div class="step-content">
                        <div class="step-title">与我所签订委托合同</div>
                    </div>
                </div>

                <div class="step">
                    <div class="step-number">2</div>
                    <div class="step-content">
                        <div class="step-title">委托人出具授权委托书</div>
                    </div>
                </div>

                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-content">
                        <div class="step-title">委托人提供身份材料:</div>
                        <div class="step-details">
                            <div class="step-detail-item">自然人:身份证复印件</div>
                            <div class="step-detail-item">法人:三件套</div>
                        </div>
                    </div>
                </div>

                <div class="step">
                    <div class="step-number">4</div>
                    <div class="step-content">
                        <div class="step-title">起草调查令申请,或提供起诉状,由我方起草</div>
                    </div>
                </div>

                <div class="step">
                    <div class="step-number">5</div>
                    <div class="step-content">
                        <div class="step-title">付费后,我所在调查令申请书上盖章</div>
                    </div>
                </div>

                <div class="step">
                    <div class="step-number">6</div>
                    <div class="step-content">
                        <div class="step-title">请提前向承办法官确认调查令申请流程,了解是否有特殊要求</div>
                    </div>
                </div>
            </div>

            <div class="price-section">
                <div class="price-card">
                    <span class="price-label">费用</span>
                    <span class="price-value">800</span>
                    <span class="price-unit">元</span> 
                </div>
            </div>
        </div>
    </div>
</body>
</html>
