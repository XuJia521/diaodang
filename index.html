<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>腾讯微信调档协作流程</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 210mm;
            height: 297mm;
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .page {
            width: 210mm;
            height: 297mm;
            padding: 15mm 20mm;
            background: #ffffff;
            position: relative;
        }

        /* 顶部装饰条 */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5mm;
            background: linear-gradient(90deg, #1a73e8 0%, #4fc3f7 50%, #00c853 100%);
        }

        /* 头部 */
        .header {
            text-align: center;
            padding-top: 8mm;
            margin-bottom: 10mm;
        }

        .logo-icon {
            width: 16mm;
            height: 16mm;
            background: linear-gradient(135deg, #07c160 0%, #00b259 100%);
            border-radius: 4mm;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 5mm;
        }

        .logo-icon svg {
            width: 10mm;
            height: 10mm;
            fill: white;
        }

        .title {
            font-size: 7mm;
            font-weight: 600;
            color: #1a1a2e;
            letter-spacing: 1mm;
        }

        .title-underline {
            width: 15mm;
            height: 1mm;
            background: linear-gradient(90deg, #1a73e8, #00c853);
            margin: 4mm auto 0;
            border-radius: 0.5mm;
        }

        /* 步骤容器 */
        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 4mm;
        }

        .step {
            display: flex;
            align-items: flex-start;
            gap: 5mm;
            padding: 5mm 6mm;
            background: #f8faff;
            border-radius: 3mm;
            border: 0.3mm solid #e8eeff;
        }

        .step-number {
            flex-shrink: 0;
            width: 10mm;
            height: 10mm;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            border-radius: 2.5mm;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 4.5mm;
        }

        .step-content {
            flex: 1;
            padding-top: 2mm;
        }

        .step-title {
            font-size: 4mm;
            font-weight: 500;
            color: #1a1a2e;
            line-height: 1.5;
        }

        .step-details {
            margin-top: 3mm;
            padding-left: 4mm;
            border-left: 0.6mm solid #e3f2fd;
        }

        .step-detail-item {
            display: flex;
            align-items: center;
            gap: 2.5mm;
            padding: 1.5mm 0;
            font-size: 3.5mm;
            color: #5a5a7a;
        }

        .step-detail-item::before {
            content: '';
            width: 1.5mm;
            height: 1.5mm;
            background: linear-gradient(135deg, #1a73e8 0%, #00c853 100%);
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* 价格区域 */
        .price-section {
            margin-top: 8mm;
        }

        .price-card {
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            border-radius: 3mm;
            padding: 6mm 8mm;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3mm;
        }

        .price-label {
            font-size: 4.5mm;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
        }

        .price-value {
            font-size: 8mm;
            font-weight: 700;
            color: white;
        }

        .price-unit {
            font-size: 4.5mm;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
        }

        /* 打印优化 */
        @media print {
            html, body {
                width: 210mm;
                height: 297mm;
            }
            
            .page {
                page-break-after: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="top-bar"></div>
        
        <div class="header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088-.181-.013-.363-.025-.547-.034h-.059zm-2.853 3.04c.504 0 .913.416.913.93 0 .513-.41.93-.913.93a.92.92 0 0 1-.914-.93c0-.514.41-.93.914-.93zm4.828 0c.504 0 .913.416.913.93 0 .513-.41.93-.913.93a.92.92 0 0 1-.914-.93c0-.514.41-.93.914-.93z"/>
                </svg>
            </div>
            <h1 class="title">腾讯微信调档协作流程</h1>
            <div class="title-underline"></div>
        </div>

        <div class="steps-container">
            <div class="step">
                <div class="step-number">1</div>
                <div class="step-content">
                    <div class="step-title">与我所签订委托合同</div>
                </div>
            </div>

            <div class="step">
                <div class="step-number">2</div>
                <div class="step-content">
                    <div class="step-title">委托人出具授权委托书</div>
                </div>
            </div>

            <div class="step">
                <div class="step-number">3</div>
                <div class="step-content">
                    <div class="step-title">委托人提供身份材料:</div>
                    <div class="step-details">
                        <div class="step-detail-item">自然人:身份证复印件</div>
                        <div class="step-detail-item">法人:三件套</div>
                    </div>
                </div>
            </div>

            <div class="step">
                <div class="step-number">4</div>
                <div class="step-content">
                    <div class="step-title">起草调查令申请,或提供起诉状,由我方起草</div>
                </div>
            </div>

            <div class="step">
                <div class="step-number">5</div>
                <div class="step-content">
                    <div class="step-title">付费后,我所在调查令申请书上盖章</div>
                </div>
            </div>

            <div class="step">
                <div class="step-number">6</div>
                <div class="step-content">
                    <div class="step-title">请提前向承办法官确认调查令申请流程,了解是否有特殊要求</div>
                </div>
            </div>
        </div>

        <div class="price-section">
            <div class="price-card">
                <span class="price-label">费用</span>
                <span class="price-value">800</span>
                <span class="price-unit">元</span>
            </div>
        </div>
    </div>
</body>
</html>
